# TLS terminator for the local gematik reference federation.
#
# gematik's gsi-server and gsi-fedmaster speak plain HTTP. `resolve_trust_chain` refuses any
# non-https issuer, and that refusal is a real security control -- so instead of adding a
# "permit http" switch that could later be set in production, the integration setup fronts both
# services with TLS and exercises the production code path unchanged.
#
# Both are published on `<name>.gsi.test` (different ports), a name that resolves
# identically whether the caller is the host test process or another container (see
# /etc/hosts and docker-compose.yml's `tls-proxy.networks.default.aliases`) -- unlike
# `localhost`, which is always the CALLER's own loopback and therefore means a different
# thing on the host than inside a container. The trust plane alone never needed
# container-to-container traffic (the fedmaster issues subordinate statements from static
# config and never calls the IdP), but the OIDC data plane does: gsi-server fetches the
# fedmaster's federation_fetch_endpoint, and fetches our relying party's own entity
# statement, both from inside its own container.
events {}
http {
    access_log /dev/stdout;

    server {
        listen 8443 ssl;
        server_name fedmaster.gsi.test;
        ssl_certificate     /certs/server.pem;
        ssl_certificate_key /certs/server.key;
        location / {
            proxy_pass http://gsi-fedmaster:8083;
            proxy_set_header Host $host:$server_port;
        }
    }

    server {
        listen 8445 ssl;
        server_name idp.gsi.test;
        ssl_certificate     /certs/server.pem;
        ssl_certificate_key /certs/server.key;
        # self_signed_tls_client_auth (RFC 8705-ish gematik variant): gsi-server's
        # RequestValidator.validateCertificate byte-compares the client cert against the
        # x5c entries in the RP's OWN entity statement -- it never checks the cert
        # against any CA. `ssl_client_certificate` still needs a value for nginx to even
        # request a client certificate during the handshake at all; it does not need to
        # be an issuer of our RP's mTLS cert (which is self-signed, not CA-issued) --
        # `optional` tolerates (does not reject) a verification failure, it only sets
        # $ssl_client_verify to FAILED, and $ssl_client_escaped_cert is populated with
        # whatever was presented either way. Reusing the same throwaway CA that signs
        # this vhost's own server cert is arbitrary -- any PEM CA bundle would do, since
        # nothing here is actually trusted against it.
        ssl_client_certificate /certs/ca.pem;
        # `optional`, not `optional_no_ca` -- as originally planned -- actually rejects
        # the handshake outright on a verification failure (confirmed empirically: with
        # `optional` here and our RP's self-signed, not-CA-issued mTLS cert presented,
        # nginx returned its own canned "400 The SSL certificate error" page and never
        # even reached gsi-server). RequestValidator.validateCertificate only needs
        # WHATEVER certificate was presented, verified or not (see this vhost's location
        # block for the actual, application-level check) -- `optional_no_ca` is nginx's
        # directive for exactly that: request a client certificate, but never fail the
        # handshake over its chain of trust.
        ssl_verify_client optional_no_ca;
        location / {
            proxy_pass http://gsi-server:8085;
            proxy_set_header Host $host:$server_port;
            # RequestValidator.validateCertificate reads this exact header name
            # (GsiConstants.TLS_CLIENT_CERT_HEADER_NAME) and URL-decodes it -- gsi-server
            # itself never terminates TLS in this setup, so it can only see the client
            # certificate if nginx (which does) hands it over like this. This is
            # HEADER-BASED PSEUDO-mTLS: it proves our client presents a certificate and
            # that certificate's bytes match our entity statement's x5c, NOT that
            # gematik's real production TLS stack would accept a self-signed_tls_client_auth
            # handshake from us -- there is no real end-to-end TLS client-auth path being
            # exercised here, only the header gsi-server would see if there were.
            proxy_set_header X-SSL-CERT $ssl_client_escaped_cert;
        }
    }

    # This relying party's OWN entity statement. gsi-server fetches
    # https://rp.gsi.test:8447/.well-known/openid-federation to get our real jwks (the
    # local fedmaster's subordinate statement about us carries only a hardcoded metadata
    # overlay, never actual keys -- see EntityStatementFederationMemberBuilder in
    # gematik's source). The RP itself is NOT a container: it's
    # tests/integration/local_federation_settings.py's Django dev server, run on the
    # HOST at port 8000, reached from inside this container via `host.docker.internal`
    # (resolved automatically by podman's gvproxy).
    server {
        listen 8447 ssl;
        server_name rp.gsi.test;
        ssl_certificate     /certs/server.pem;
        ssl_certificate_key /certs/server.key;
        location / {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host:$server_port;
        }
    }
}
