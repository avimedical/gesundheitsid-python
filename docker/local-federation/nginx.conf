# TLS terminator for the local gematik reference federation.
#
# gematik's gsi-server and gsi-fedmaster speak plain HTTP. `resolve_trust_chain` refuses any
# non-https issuer, and that refusal is a real security control -- so instead of adding a
# "permit http" switch that could later be set in production, the integration setup fronts both
# services with TLS and exercises the production code path unchanged.
#
# Both are published on `localhost` (different ports) rather than on container hostnames,
# because the test process runs on the HOST: an entity statement's issuer has to be fetchable
# by whoever validates the chain, and `https://gsi-fedmaster:8083` is not resolvable there.
# Nothing in the trust-plane flow needs container-to-container traffic -- the fedmaster issues
# subordinate statements from static config and never calls the IdP.
events {}
http {
    access_log /dev/stdout;

    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate     /certs/server.pem;
        ssl_certificate_key /certs/server.key;
        location / {
            proxy_pass http://gsi-fedmaster:8083;
            proxy_set_header Host $host:$server_port;
        }
    }

    server {
        listen 8445 ssl;
        server_name localhost;
        ssl_certificate     /certs/server.pem;
        ssl_certificate_key /certs/server.key;
        location / {
            proxy_pass http://gsi-server:8085;
            proxy_set_header Host $host:$server_port;
        }
    }
}
