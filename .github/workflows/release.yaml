name: Release

# Fires when a GitHub Release is published (i.e. a maintainer promotes a draft/tag to a
# real release), not on every push or tag creation -- publishing to PyPI should be a
# deliberate act, not something a stray `git tag && git push --tags` triggers.
on:
  release:
    types: [published]

# Minimal by default; the `publish` job below grants itself id-token: write on top of
# this, since that is only needed for the one job that actually talks to PyPI.
permissions:
  contents: read

jobs:
  # Gate the publish on the exact same test/build/OSS-hygiene gate every push and PR
  # already has to pass -- a GitHub Release being cut is not a reason to skip it.
  ci:
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/ci.yaml

  publish:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gesundheitsid/
    # id-token: write is the whole trick: it lets pypa/gh-action-pypi-publish request a
    # short-lived OIDC token from GitHub and exchange it with PyPI for upload credentials.
    # No PYPI_API_TOKEN secret exists anywhere in this repo, and none should be added --
    # trusted publishing replaces it entirely.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      - name: Build both packages
        run: uv build

      # A GitHub Release is cut by hand and `version` in pyproject.toml is static, so
      # nothing links the two. Tagging v0.2.0 while pyproject.toml still says 0.1.0 builds
      # gesundheitsid-0.1.0 and uploads it under a release announcing 0.2.0. Neither
      # outcome is recoverable: PyPI refuses a duplicate filename, and it never allows a
      # filename to be reused even after the release is deleted -- so a wrong version
      # burns that version number permanently. Compare the tag against the version
      # actually baked into the built artifact rather than against pyproject.toml, so a
      # hatchling misconfiguration cannot slip past this check either.
      - name: Verify the release tag matches the built version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          expected="${RELEASE_TAG#v}"
          sdist=$(find dist -maxdepth 1 -name 'gesundheitsid-*.tar.gz' -print -quit)
          if [ -z "$sdist" ]; then
            echo "::error::no gesundheitsid sdist found in dist/ -- did 'uv build' change its output layout?"
            exit 1
          fi
          built=$(basename "$sdist" .tar.gz)
          built="${built#gesundheitsid-}"
          if [ "$built" != "$expected" ]; then
            echo "::error::release tag '${RELEASE_TAG}' implies version '${expected}', but the build produced '${built}' ([project].version in pyproject.toml). Bump pyproject.toml, then delete this release and its tag and cut it again -- PyPI filenames can never be reused, so publishing a mismatched version is permanent."
            exit 1
          fi
          echo "release tag ${RELEASE_TAG} matches built version ${built}"

      # NOTE for the first release: trusted publishing must be configured on the PyPI
      # side *before* this step will succeed. This repo publishes exactly ONE PyPI
      # project, "gesundheitsid" -- its single wheel bundles the gesundheitsid,
      # gesundheitsid_cli and django_gesundheitsid import packages (see ci.yaml's build
      # job and [tool.hatch.build.targets.wheel] in pyproject.toml), there is no separate
      # "gesundheitsid_cli" PyPI project to register. Go to that project's PyPI page ->
      # Publishing -> Add a new publisher, and register: owner "avimedical", repository
      # "gesundheitsid-python", workflow name "release.yaml", environment "pypi". If the
      # project does not exist on PyPI yet, PyPI also supports "pending publisher"
      # registration ahead of the first upload -- create that instead of minting an API
      # token as a workaround.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
