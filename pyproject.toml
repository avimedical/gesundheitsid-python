[project]
name = "gesundheitsid"
version = "0.3.0"
description = "OpenID Federation relying party for Germany's GesundheitsID (gematik TI-Föderation)"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["gesundheitsid", "gematik", "openid-federation", "oidc", "telematik", "ti-foederation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
dependencies = [
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "joserfc>=1.5.0",
]

# Kept separate from `dependencies` on purpose: the core `gesundheitsid` package must stay
# usable by anything, not just Django services, so Django/Authlib/django-redis are only
# ever pulled in by callers who explicitly opt into the `django` extra.
[project.optional-dependencies]
django = [
    "django>=5.2",
    "authlib>=1.7",
    "django-redis>=6.0",
]

[project.scripts]
gesundheitsid-cli = "gesundheitsid_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/avimedical/gesundheitsid-python"
Repository = "https://github.com/avimedical/gesundheitsid-python"
Issues = "https://github.com/avimedical/gesundheitsid-python/issues"
Changelog = "https://github.com/avimedical/gesundheitsid-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-django>=4.9.0",
    "respx>=0.22.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gesundheitsid", "gesundheitsid_cli", "django_gesundheitsid"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gesundheitsid", "gesundheitsid_cli", "django_gesundheitsid"]
