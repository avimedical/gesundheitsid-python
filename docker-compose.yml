# Local gematik reference federation (app-gemSekIdp: gsi-fedmaster + gsi-server) for
# offline GesundheitsID development. See docs/local-federation.md for exactly what was
# verified about these images and how to build them.
#
# gematik does NOT publish these images on GHCR or Docker Hub (verified 2026-08-08 --
# 0 GitHub Packages on gematik/app-gemSekIdp; no gsi-server/gsi-fedmaster repo among the
# gematik1 Docker Hub org's 93 repos). You must build them locally first; until you do,
# `docker compose up` fails with "pull access denied" / "manifest unknown" -- that is
# intentional so this file never claims an image exists that gematik does not publish.
#
# `pull_policy: never` requires Compose Spec support for that key (Docker Compose v2.10+).
# If your compose tool rejects it, delete the line -- it only prevents an accidental pull
# attempt against a registry that has nothing to serve.

services:
  gsi-fedmaster:
    image: local/idm/gsi-fedmaster:8.4.2 # tag produced by the build in docs/local-federation.md; check it matches your checkout
    pull_policy: never
    ports:
      - "8083:8083" # HTTP API / .well-known/openid-federation for the fedmaster entity itself
      - "8183:8183" # actuator health
    environment:
      # application.yml defaults ISSUER_IDP_01 to 127.0.0.1, unreachable from inside this
      # container -- point it at gsi-server's compose service name instead.
      # Must equal gsi-server's own `iss` exactly, or the fedmaster will not vouch for it.
      # Both are the https URL the TLS terminator publishes, because that is the URL a
      # host-side validator can actually fetch (see docker/local-federation/nginx.conf).
      ISSUER_IDP_01: "https://localhost:8445"
      # The fedmaster's own `iss`, and what gsi-server puts in `authority_hints`.
      FEDMASTER_SERVER_URL: "https://localhost:8443"

  gsi-server:
    image: local/idm/gsi-server:8.4.2 # tag produced by the build in docs/local-federation.md; check it matches your checkout
    pull_policy: never
    ports:
      - "8085:8085" # entity statement: GET /.well-known/openid-federation
      - "8185:8185" # actuator health
    environment:
      # Same reasoning as gsi-fedmaster's ISSUER_IDP_01 above, in the other direction.
      FEDMASTER_SERVER_URL: "https://localhost:8443"
      GSI_SERVER_URL: "https://localhost:8445"
    depends_on:
      - gsi-fedmaster

  # See docker/local-federation/nginx.conf for why this exists at all. Run
  # `uv run python scripts/local_federation_certs.py` once before `docker compose up`.
  tls-proxy:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "8443:8443" # https -> gsi-fedmaster
      - "8445:8445" # https -> gsi-server
    volumes:
      - ./docker/local-federation/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.local-federation/server.pem:/certs/server.pem:ro
      - ./.local-federation/server.key:/certs/server.key:ro
    depends_on:
      - gsi-fedmaster
      - gsi-server
