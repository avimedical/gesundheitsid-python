# Local gematik reference federation (app-gemSekIdp: gsi-fedmaster + gsi-server) for
# offline GesundheitsID development. See docs/local-federation.md for exactly what was
# verified about these images and how to build them.
#
# gematik does NOT publish these images on GHCR or Docker Hub (verified 2026-08-08 --
# 0 GitHub Packages on gematik/app-gemSekIdp; no gsi-server/gsi-fedmaster repo among the
# gematik1 Docker Hub org's 93 repos). You must build them locally first; until you do,
# `docker compose up` fails with "pull access denied" / "manifest unknown" -- that is
# intentional so this file never claims an image exists that gematik does not publish.
#
# `pull_policy: never` requires Compose Spec support for that key (Docker Compose v2.10+).
# If your compose tool rejects it, delete the line -- it only prevents an accidental pull
# attempt against a registry that has nothing to serve.

services:
  gsi-fedmaster:
    # `-rp` tag, not the plain `8.4.2` gsi-server uses: this image is NOT the one gematik's
    # own build produces. `KeyConfiguration`/`ResourceReader.getFileFromResourceAsTmpFile`
    # loads a relying party's registered key via `Thread.currentThread().
    # getContextClassLoader().getResourceAsStream(...)` -- i.e. ONLY from inside the running
    # jar's own classpath (`BOOT-INF/classes/...`), because the Dockerfile launches it with
    # `java -jar`, whose classpath is fixed to the jar's own nested archives (Spring Boot's
    # `JarLauncher`, confirmed by decompiling the built jar's manifest and loader classes --
    # `loader.path`/`PropertiesLauncher`-style extra locations are simply not consulted by
    # `JarLauncher`). A bind-mounted key file elsewhere in the container filesystem is
    # therefore invisible to it, no matter where it's mounted -- there is no shortcut here.
    # This image is gsi-fedmaster:8.4.2 rebuilt with our RP's ES-signing PUBLIC key baked
    # into gsi-fedmaster/src/main/resources/keys/ref-rp-local-es-sig-pubkey.pem (only the
    # public half -- see docs/local-federation.md's "Registering our relying party" section
    # for the exact rebuild recipe, which is why the tag is retagged distinctly rather than
    # silently overwriting `8.4.2`).
    image: local/idm/gsi-fedmaster:8.4.2-rp
    pull_policy: never
    ports:
      - "8083:8083" # HTTP API / .well-known/openid-federation for the fedmaster entity itself
      - "8183:8183" # actuator health
    environment:
      # `.gsi.test` names (IANA-reserved for local use per RFC 6761 -- unlike `.local`,
      # which macOS's mDNSResponder intercepts, producing intermittent lookup failures)
      # resolve to 127.0.0.1 on the host (see /etc/hosts) AND to this same tls-proxy
      # container inside the compose network (see tls-proxy's `networks.default.aliases`
      # below) -- the same name works whether the caller is the host test process or
      # another container, which `localhost` could never do (that's always the caller's
      # own loopback). Must equal gsi-server's own `iss` exactly, or the fedmaster will
      # not vouch for it. Both are the https URL the TLS terminator publishes, because
      # that is the URL any validator -- host or container -- can actually fetch (see
      # docker/local-federation/nginx.conf).
      ISSUER_IDP_01: "https://idp.gsi.test:8445"
      # The fedmaster's own `iss`, and what gsi-server puts in `authority_hints`.
      FEDMASTER_SERVER_URL: "https://fedmaster.gsi.test:8443"
      # FedMasterConfiguration.relyingPartyConfigs[0], replacing the shipped "GRAS"
      # example RP with ours -- ALL FIVE fields, not just the ones we care about
      # changing. DEFECT FOUND: Spring Boot's Binder does not merge a List<T>-typed
      # @ConfigurationProperties value across property sources per-element; once ANY
      # property source defines part of an indexed list, THAT SOURCE ALONE supplies the
      # WHOLE element, silently nulling every field the override didn't also set. A
      # first attempt here that only set KEYCONFIG_FILENAME/KEYCONFIG_KEYID (relying on
      # the yaml's own `${ISSUER_RP_01:...}` placeholder for `issuer`, the way
      # ISSUER_IDP_01 works for identityProviderConfigs) produced
      # RelyingPartyConfig(issuer=null, organizationName=null, keyConfig=KeyConfig(...,
      # use=null, ...)) -- confirmed via gsi-fedmaster's own startup log line -- which
      # then NullPointerException'd inside EntityStatementFederationMemberBuilder.getKey
      # (issuer=null) AND would have thrown again inside
      # KeyConfiguration.getFederationPubKey (`Optional.of(keyConfiguration.getUse())`
      # with use=null -- Optional.of rejects null) had the first NPE not fired first.
      # `${ISSUER_IDP_01:...}`'s placeholder mechanism is unaffected by this because it
      # is a plain string substitution INSIDE the yaml's own text, resolved while
      # parsing that one property source -- not a second source contending for the same
      # indexed list the way these env vars are.
      FEDMASTER_RELYINGPARTYCONFIGS_0_ISSUER: "https://rp.gsi.test:8447"
      FEDMASTER_RELYINGPARTYCONFIGS_0_ORGANIZATIONNAME: "gesundheitsid-python local federation RP"
      # The ES-signing PUBLIC key `gesundheitsid-cli keygen` wrote to
      # .local-federation/rp/, baked into the `-rp` image tag above (see its comment for
      # why a bind mount cannot do this instead). The key ID must equal
      # GESUNDHEITSID["KEYS"]["ENTITY_STATEMENT_SIG"]'s own `kid` -- keygen prints it,
      # also visible via `jq .keys[0].kid .local-federation/rp/es_sig_*_jwks.json`. If
      # you regenerate that key, this value goes stale silently -- update it too.
      FEDMASTER_RELYINGPARTYCONFIGS_0_KEYCONFIG_FILENAME: "keys/ref-rp-local-es-sig-pubkey.pem"
      FEDMASTER_RELYINGPARTYCONFIGS_0_KEYCONFIG_KEYID: "TWuLB_S4B5VbXNopLrUZ3P-sIrP14p0nyKW5G34nNAM"
      FEDMASTER_RELYINGPARTYCONFIGS_0_KEYCONFIG_USE: "sig"

  gsi-server:
    image: local/idm/gsi-server:8.4.2 # tag produced by the build in docs/local-federation.md; check it matches your checkout
    pull_policy: never
    ports:
      - "8085:8085" # entity statement: GET /.well-known/openid-federation
      - "8185:8185" # actuator health
    environment:
      # Same reasoning as gsi-fedmaster's ISSUER_IDP_01 above, in the other direction --
      # and this value must be byte-identical to gsi-fedmaster's own FEDMASTER_SERVER_URL,
      # since the fedmaster compares an incoming fetch request's `iss` against its own
      # configured `serverUrl` verbatim.
      FEDMASTER_SERVER_URL: "https://fedmaster.gsi.test:8443"
      GSI_SERVER_URL: "https://idp.gsi.test:8445"
      # gsi.serverUrlMtls is a SEPARATE property from gsi.serverUrl -- EntityStatementBuilder.
      # buildMetadata() derives token_endpoint and pushed_authorization_request_endpoint from
      # THIS one, not GSI_SERVER_URL above. Left unset, both endpoints are advertised on
      # http://127.0.0.1:8085 (the property's own default) even though GSI_SERVER_URL correctly
      # points authorization_endpoint at the https name above -- a real client would resolve a
      # trust chain over https and then get handed plain-http, unreachable-from-outside PAR/token
      # endpoints. Same https name/port as GSI_SERVER_URL: nginx's idp.gsi.test vhost fronts the
      # same gsi-server:8085 for all three endpoints, there is nothing mTLS-specific about the
      # port on OUR side of the proxy (client-cert enforcement is a step of its own).
      GSI_SERVER_URL_MTLS: "https://idp.gsi.test:8445"
      # gsi.clientCertRequired defaults to false; left there, self_signed_tls_client_auth
      # (the whole point of the mTLS client in gesundheitsid/crypto/mtls.py) is never
      # actually enforced by the counterparty, and this exercise would miss its main
      # target. DEFECT FOUND: the property's OWN Java field is `clientCertRequired`, and
      # the task's originally-assumed env var GSI_CLIENTCERTREQUIRED (no separators
      # between words) does NOT bind to it -- confirmed via GsiServer's own startup
      # diagnostic (`log.info("GSI_CLIENT_CERT_REQUIRED in env: " +
      # System.getenv("GSI_CLIENT_CERT_REQUIRED"))`, immediately followed by a log of the
      # ACTUAL bound `isClientCertRequired`): setting GSI_CLIENTCERTREQUIRED left both
      # that raw env lookup AND the bound config value showing `false`/`null`. The
      # underscore-per-word form below is what gematik's own developers use to debug
      # this exact property, and it is what Spring's relaxed binding actually matches.
      GSI_CLIENT_CERT_REQUIRED: "true"
      # DEFECT FOUND: gsi-server calls OUT over https too (the fedmaster's
      # federation_fetch_endpoint during PAR, and -- once a relying party is registered
      # -- that relying party's own entity statement), via Java's platform default
      # SSLContext, which trusts only the JDK's built-in public CA bundle. In gematik's
      # real environment every counterparty chains to a publicly trusted CA, so this is
      # invisible; our throwaway CA is not, so those calls failed
      # `SSLHandshakeException: PKIX path building failed` (confirmed empirically -- and
      # note it does NOT surface until something actually exercises those calls, i.e.
      # not until step 4/PAR, well after the trust plane was fully verified working).
      # `JAVA_TOOL_OPTIONS` is read by any `java` invocation automatically, so this works
      # without touching the image's fixed `CMD ["java", "-jar", ...]`.
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/certs/truststore.p12
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ./.local-federation/truststore.p12:/certs/truststore.p12:ro
    depends_on:
      - gsi-fedmaster

  # See docker/local-federation/nginx.conf for why this exists at all. Run
  # `uv run python scripts/local_federation_certs.py` once before `docker compose up`.
  tls-proxy:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "8443:8443" # https -> gsi-fedmaster
      - "8445:8445" # https -> gsi-server
      # https -> this relying party's own dev server, running on the HOST (not a
      # container) via `tests/integration/local_federation_settings.py` -- see
      # docker/local-federation/nginx.conf's fourth vhost, which forwards to
      # `host.docker.internal:8000`. Podman's gvproxy resolves `host.docker.internal`
      # from inside a container automatically; no `extra_hosts` entry was needed
      # (verified: `podman exec ... getent hosts host.docker.internal`).
      - "8447:8447"
    volumes:
      - ./docker/local-federation/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.local-federation/server.pem:/certs/server.pem:ro
      - ./.local-federation/server.key:/certs/server.key:ro
      # ssl_client_certificate on the idp.gsi.test vhost -- see nginx.conf's comment on
      # why this doesn't need to actually be an issuer of the RP's mTLS cert.
      - ./.local-federation/ca.pem:/certs/ca.pem:ro
    networks:
      # A container reaching this proxy (gsi-server fetching the fedmaster's
      # federation_fetch_endpoint, or fetching our RP's own entity statement) needs
      # these three names to resolve to THIS container on the compose network, exactly
      # as they resolve to 127.0.0.1 -> this container's published ports on the host.
      # Without this, only the host side of docker-compose.yml's hostnames would work,
      # which is precisely the localhost-inside-a-container trap this step exists to fix.
      default:
        aliases:
          - fedmaster.gsi.test
          - idp.gsi.test
          - rp.gsi.test
    depends_on:
      - gsi-fedmaster
      - gsi-server
